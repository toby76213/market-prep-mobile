<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090c">
<title>Market Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090c; --bg1:#111215; --bg2:#1a1d27; --border:#2a2b2f;
    --gold:#e8a838; --green:#4caf50; --red:#ff6b6b; --blue:#58b4ff;
    --text:#e2e5ea; --dim:#8a93a0; --label:#c3c9d2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Roboto',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  .num{font-family:'Inter',sans-serif;}
  .wrap{max-width:640px; margin:0 auto; padding:16px 16px 48px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .topbar h1{font-size:20px; margin:0; font-weight:700; letter-spacing:0.2px;}
  .topbar .sub{font-size:11px; color:var(--dim); margin-top:2px;}
  #refreshBtn{background:var(--bg2); border:1px solid var(--border); color:var(--label);
    border-radius:12px; padding:8px 12px; font-size:12px; font-family:inherit; cursor:pointer;}
  #refreshBtn:active{opacity:0.7;}

  .mktdir{display:flex; gap:8px; margin-bottom:14px;}
  .mchip{flex:1; background:var(--bg1); border:1px solid var(--border); border-radius:12px;
    padding:9px 6px; text-align:center;}
  .mchip .ml{font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.5px;}
  .mchip .mv{font-size:18px; font-weight:700; font-family:'Inter',sans-serif; margin-top:3px; color:var(--text);}
  .mchip.up{border-color:rgba(76,175,80,0.5);} .mchip.up .mv{color:var(--green);}
  .mchip.down{border-color:rgba(255,107,107,0.5);} .mchip.down .mv{color:var(--red);}
  .mchip.neutral{border-color:rgba(232,168,56,0.4);} .mchip.neutral .mv{color:var(--gold);}

  .banner{background:var(--bg2); border:1px solid var(--gold); border-radius:14px;
    padding:12px 14px; font-size:13.5px; line-height:1.5; margin-bottom:14px; color:var(--text);}
  .banner.stale{border-color:#5a5f6a;}

  .card{background:var(--bg1); border:1px solid var(--border); border-radius:16px;
    padding:14px 16px; margin-bottom:14px;}
  .card h2{font-size:12.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--label);
    margin:0 0 10px; font-weight:700;}

  .macroline{font-size:13px; color:var(--text); line-height:1.5; margin-bottom:6px;}
  .macroline .k{color:var(--dim); margin-right:6px;}

  .posgrid{display:flex; flex-direction:column; gap:8px;}
  .poscard{background:var(--bg2); border:1px solid var(--border); border-radius:12px;
    padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .poscard.st-STOP, .poscard.st-EXIT{border-left:3px solid var(--red);}
  .poscard.st-HOLD{border-left:3px solid var(--green);}
  .poscard.st-GAPWATCH{border-left:3px solid var(--red);}
  .poscard.st-T1NEAR{border-left:3px solid var(--gold);}
  .pos-left{min-width:0;}
  .pos-sym{font-size:14.5px; font-weight:700; font-family:'Inter',sans-serif;}
  .pos-note{font-size:11.5px; color:var(--dim); margin-top:2px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  .pos-right{text-align:right; flex-shrink:0;}
  .pos-price{font-size:13.5px; font-family:'Inter',sans-serif;}
  .pos-chg{font-size:11px; font-family:'Inter',sans-serif;}
  .pos-chg.up{color:var(--green);} .pos-chg.down{color:var(--red);}
  .badge{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.3px;
    padding:3px 8px; border-radius:8px; margin-top:4px;}
  .badge.st-HOLD{background:rgba(76,175,80,0.15); color:var(--green);}
  .badge.st-STOP{background:rgba(255,107,107,0.15); color:var(--red);}
  .badge.st-EXIT{background:rgba(255,107,107,0.15); color:var(--red);}
  .badge.st-GAPWATCH{background:rgba(255,107,107,0.15); color:var(--red);}
  .badge.st-T1NEAR{background:rgba(232,168,56,0.15); color:var(--gold);}

  .watchlist{display:flex; flex-direction:column; gap:6px;}
  .witem{display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 0; border-bottom:1px solid var(--border);}
  .witem:last-child{border-bottom:none;}
  .witem .sym{font-size:13.5px; font-weight:700; font-family:'Inter',sans-serif; min-width:52px;}
  .witem .note{font-size:11.5px; color:var(--dim); flex:1; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; margin:0 8px;}
  .witem .lprice{font-size:13px; font-family:'Inter',sans-serif; color:var(--label); flex-shrink:0;}

  .pos-live{font-size:11px; font-family:'Inter',sans-serif; color:var(--blue); margin-top:2px;}

  .fbcard h2{cursor:pointer; display:flex; align-items:center; justify-content:space-between; margin-bottom:0;}
  .fbcard h2 .caret{font-size:14px; color:var(--gold); transition:transform 0.15s; line-height:1;}
  .fbcard.open h2 .caret{transform:rotate(90deg);}
  .fbcard h2 .hint{font-size:10px; color:var(--dim); font-weight:400; text-transform:none; letter-spacing:0; margin-left:8px;}
  .fbbody{display:none; margin-top:10px;}
  .fbcard.open .fbbody{display:block;}
  .fbline{font-size:12.5px; line-height:1.5; color:var(--text); padding:6px 0; border-bottom:1px solid var(--border);}
  .fbline:last-child{border-bottom:none;}
  .fbline .fsym{font-weight:700; font-family:'Inter',sans-serif; color:var(--label); margin-right:5px;}

  .empty{color:var(--dim); font-size:13px; text-align:center; padding:20px 0;}
  footer{text-align:center; color:#565b64; font-size:10.5px; margin-top:18px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Market Prep</h1>
      <div class="sub" id="freshness">Loading&hellip;</div>
    </div>
    <button id="refreshBtn" onclick="loadAll()">Refresh</button>
  </div>

  <div class="mktdir" id="mktDir"></div>

  <div class="banner" id="watchBanner">Loading latest briefing&hellip;</div>

  <div class="card">
    <h2>Macro</h2>
    <div class="macroline"><span class="k">Macro</span><span id="macroLine">&mdash;</span></div>
    <div class="macroline"><span class="k">Standouts</span><span id="standoutsLine">&mdash;</span></div>
    <div class="macroline"><span class="k">Catalyst</span><span id="catalystLine">&mdash;</span></div>
  </div>

  <div class="card">
    <h2>Positions</h2>
    <div class="posgrid" id="posGrid"><div class="empty">No position data yet.</div></div>
  </div>

  <div class="card">
    <h2>Range Trades</h2>
    <div class="watchlist" id="rangeList"><div class="empty">&mdash;</div></div>
  </div>

  <div class="card">
    <h2>Long Holds</h2>
    <div class="watchlist" id="longList"><div class="empty">&mdash;</div></div>
  </div>

  <div class="card fbcard" id="fbCard">
    <h2 onclick="toggleFullBrief()"><span>Full Briefing <span class="hint">tap to expand</span></span><span class="caret">&rsaquo;</span></h2>
    <div class="fbbody" id="fbBody"><div class="empty">&mdash;</div></div>
  </div>

  <footer>
    Auto-updates weekday mornings from the Pre-Open Briefing.<br>
    Tap Share &rarr; Add to Home Screen for an app-like icon.
  </footer>

</div>

<script>
const DATA_URL = 'data.json';

function fmtAgo(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const diffMs = Date.now() - d.getTime();
  const mins = Math.round(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins/60);
  if(hrs < 48) return hrs + ' hr' + (hrs===1?'':'s') + ' ago';
  const days = Math.round(hrs/24);
  return days + ' day' + (days===1?'':'s') + ' ago';
}

function statusClass(status){
  return 'st-' + (status || '').replace(/\s+/g,'').toUpperCase();
}

function parseDir(s){
  if(!s) return null;
  const d = {};
  let m = s.match(/ES\s*([+-]?[\d.]+%)/i);   if(m) d.es  = m[1];
  m = s.match(/NQ\s*([+-]?[\d.]+%)/i);        if(m) d.nq  = m[1];
  m = s.match(/VIX\s*~?\$?([\d.]+)/i);        if(m) d.vix = m[1];
  return Object.keys(d).length ? d : null;
}

function mchip(label, val, isVix){
  if(!val) return '';
  let cls = 'neutral';
  if(!isVix){
    if(/^-/.test(val)) cls = 'down';
    else cls = 'up';           // "+0.9%" or a bare positive number
  }
  return `<div class="mchip ${cls}"><div class="ml">${label}</div><div class="mv">${val}</div></div>`;
}

function renderMarketDir(d){
  const el = document.getElementById('mktDir');
  const dir = d.marketDirection || parseDir(d.macro) || parseDir(d.watchAlert);
  if(!dir){ el.innerHTML = ''; return; }
  el.innerHTML = mchip('S&P Fut', dir.es, false)
               + mchip('Nasdaq Fut', dir.nq, false)
               + mchip('VIX', dir.vix, true);
}

function renderPositions(positions){
  const el = document.getElementById('posGrid');
  if(!positions || !positions.length){
    el.innerHTML = '<div class="empty">No position data yet.</div>';
    return;
  }
  el.innerHTML = positions.map(p => {
    const chgNum = typeof p.changePct === 'number' ? p.changePct : null;
    const chgClass = chgNum === null ? '' : (chgNum >= 0 ? 'up' : 'down');
    const chgText = chgNum === null ? '' : (chgNum >= 0 ? '+' : '') + chgNum.toFixed(1) + '%';
    const priceText = typeof p.price === 'number' ? '$' + p.price.toFixed(2) : '';
    const sc = statusClass(p.status);
    let statusLabel = p.status || '';
    if(sc === 'st-STOP' && p.stopPrice){
      statusLabel = 'STOP $' + Number(p.stopPrice).toFixed(2);
    }
    return `<div class="poscard ${sc}">
      <div class="pos-left">
        <div class="pos-sym">${p.symbol || ''}</div>
        ${p.note ? `<div class="pos-note">${p.note}</div>` : ''}
      </div>
      <div class="pos-right">
        <div class="pos-price">${priceText} <span class="pos-chg ${chgClass}">${chgText}</span></div>
        <div class="pos-live liveprice" data-sym="${p.symbol || ''}">&hellip;</div>
        <div class="badge ${sc}">${statusLabel}</div>
      </div>
    </div>`;
  }).join('');
}

function renderWatchlist(elId, items, thesisKey){
  const el = document.getElementById(elId);
  if(!items || !items.length){
    el.innerHTML = '<div class="empty">&mdash;</div>';
    return;
  }
  el.innerHTML = items.map(it => {
    const note = it[thesisKey] || it.notes || it.thesis || '';
    return `<div class="witem">
      <div class="sym">${it.symbol}</div>
      <div class="note">${note}</div>
      <div class="lprice liveprice" data-sym="${it.symbol}">&hellip;</div>
    </div>`;
  }).join('');
}

const priceCache = {};
async function fetchQuote(symbol){
  if(symbol in priceCache) return priceCache[symbol];
  try{
    const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=1d&interval=1m`);
    if(!res.ok) throw new Error('bad response');
    const j = await res.json();
    const result = j.chart && j.chart.result && j.chart.result[0];
    const price = result && result.meta && (result.meta.regularMarketPrice ?? result.meta.previousClose);
    priceCache[symbol] = (typeof price === 'number') ? price : null;
  } catch(e){
    priceCache[symbol] = null;
  }
  return priceCache[symbol];
}

async function hydrateLivePrices(){
  const els = Array.from(document.querySelectorAll('.liveprice'));
  const syms = [...new Set(els.map(e => e.getAttribute('data-sym')).filter(Boolean))];
  await Promise.all(syms.map(async sym => {
    const price = await fetchQuote(sym);
    document.querySelectorAll('.liveprice[data-sym="' + sym + '"]').forEach(el => {
      const isPos = el.classList.contains('pos-live');
      if(price === null){ el.textContent = isPos ? '' : '—'; return; }
      el.textContent = (isPos ? 'Live $' : '$') + price.toFixed(2);
    });
  }));
}

function renderFullBrief(text){
  const card = document.getElementById('fbCard');
  const body = document.getElementById('fbBody');
  if(!text){ body.innerHTML = '<div class="empty">&mdash;</div>'; return; }
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  body.innerHTML = lines.map(line => {
    const m = line.match(/^([A-Z]{1,5})\s/);
    if(m){
      const sym = m[1];
      const rest = line.slice(sym.length);
      return '<div class="fbline"><span class="fsym">' + sym + '</span>' + rest + '</div>';
    }
    return '<div class="fbline">' + line + '</div>';
  }).join('');
  let open = false;
  try{ open = localStorage.getItem('mp_fb_open') === '1'; }catch(e){}
  card.classList.toggle('open', open);
}

function toggleFullBrief(){
  const card = document.getElementById('fbCard');
  const open = card.classList.toggle('open');
  try{ localStorage.setItem('mp_fb_open', open ? '1' : '0'); }catch(e){}
}

async function loadAll(){
  document.getElementById('freshness').textContent = 'Loading…';
  try{
    const res = await fetch(DATA_URL + '?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('data.json not found (' + res.status + ')');
    const d = await res.json();

    const ago = fmtAgo(d.generatedAt);
    document.getElementById('freshness').textContent = (d.asOfLabel || '') + (ago ? ' · ' + ago : '');

    renderMarketDir(d);

    const banner = document.getElementById('watchBanner');
    banner.textContent = d.watchAlert || 'No briefing yet.';
    const staleHrs = d.generatedAt ? (Date.now() - new Date(d.generatedAt).getTime())/3600000 : 999;
    banner.className = 'banner' + (staleHrs > 20 ? ' stale' : '');

    document.getElementById('macroLine').textContent = d.macro || '—';
    document.getElementById('standoutsLine').textContent = d.standouts || '—';
    document.getElementById('catalystLine').textContent = d.catalyst || '—';

    renderPositions(d.positions);
    renderWatchlist('rangeList', d.rangeWatch, 'notes');
    renderWatchlist('longList', d.longWatch, 'thesis');
    renderFullBrief(d.fullBrief);
    hydrateLivePrices();

  } catch(e){
    document.getElementById('freshness').textContent = 'Could not load data';
    document.getElementById('watchBanner').textContent = 'No data yet — the morning briefing hasn’t published data.json here yet, or the fetch failed: ' + e.message;
    document.getElementById('watchBanner').classList.add('stale');
  }
}

loadAll();
</script>
</body>
</html>
